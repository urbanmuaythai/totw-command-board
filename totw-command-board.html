<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Muaythai — Theme of the Week</title>
<link rel="icon" type="image/png" href="assets/brand/logo.png">
<link rel="apple-touch-icon" href="assets/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0F17; --panel:#151725; --panel-2:#1B1F3B; --line:#2A2E44;
    --red:#C8102E; --red-hot:#E11836; --paper:#F4F2EC; --paper-dim:#C9CDDA;
    --muted:#8A8FA3; --gold:#E4B851; --steel:#C9CDDA; --ok:#3FB984;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7); --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      linear-gradient(180deg, rgba(14,15,23,.93), rgba(14,15,23,.97)),
      radial-gradient(1200px 600px at 85% -10%, rgba(200,16,46,.14), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(27,31,59,.6), transparent 55%),
      url('assets/brand/gym-bg.png') center 20%/cover no-repeat fixed,
      var(--ink);
    color:var(--paper); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100vh;
  }
  @media (max-width:760px){ body{ background-attachment:scroll; } }
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 80px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .lockup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .lockup img{height:58px;width:auto;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  @media (max-width:420px){ .lockup img{height:46px} .lockup .u{font-size:26px} }
  .lockup .u{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.06em;line-height:.9}
  .lockup .u b{color:var(--red)}
  .lockup .tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;padding-bottom:3px}

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tabs button{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.18s}
  .tabs button:hover{color:var(--paper)}
  .tabs button[aria-selected="true"]{background:var(--red);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--red-hot);outline-offset:2px}

  .board{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;background:var(--panel)}
  .board .cell{flex:1;padding:12px 16px;position:relative}
  .board .cell + .cell{border-left:1px solid var(--line)}
  .board .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .board .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(200,16,46,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.55)}70%{box-shadow:0 0 0 8px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
  .board .v{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;line-height:1}
  .board .cell.next .v{color:var(--paper-dim)}
  @media (prefers-reduced-motion:reduce){.board .dot{animation:none}}

  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .weeknav .lbl{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--paper-dim);text-transform:uppercase}
  .weeknav .grp{display:flex;gap:6px}
  .btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.16s}
  .btn:hover{border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--red-hot);outline-offset:2px}
  .btn.solid{background:var(--red);border-color:var(--red);color:#fff}
  .btn.solid:hover{background:var(--red-hot);border-color:var(--red-hot)}
  .btn[disabled]{opacity:.35;cursor:default}
  .btn.ghost{background:transparent}

  .hero{position:relative;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:26px 26px 24px;overflow:hidden;box-shadow:var(--shadow)}
  .hero:before{content:"";position:absolute;top:0;left:0;width:6px;height:100%;background:var(--red)}
  .hero .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,11vw,104px);line-height:.86;letter-spacing:.01em;margin:6px 0 4px}
  .hero .sub{color:var(--paper-dim);max-width:64ch}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chip{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--paper-dim);display:inline-flex;gap:8px;align-items:center}
  .chip.live{border-color:var(--red);color:#fff;background:rgba(200,16,46,.16)}

  .section-h{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .section-h:after{content:"";flex:1;height:1px;background:var(--line)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card p{margin:0;color:var(--paper)}
  .card p.dim{color:var(--paper-dim)}

  .points{list-style:none;padding:0;margin:0}
  .points li{position:relative;padding-left:22px;margin-bottom:10px;color:var(--paper-dim)}
  .points li:last-child{margin-bottom:0}
  .points li:before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;background:var(--red);transform:rotate(45deg)}
  .points li strong{color:#fff;font-weight:700}
  .card.safety{border-color:rgba(200,16,46,.4)}

  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .level{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--line)}
  .level.kids{border-top-color:var(--gold)} .level.all{border-top-color:var(--steel)} .level.adv{border-top-color:var(--red)}
  .level h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;margin:0 0 8px;display:flex;align-items:center;gap:9px}
  .level .pip{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}
  .level.kids .pip{background:var(--gold)} .level.all .pip{background:var(--steel)} .level.adv .pip{background:var(--red)}
  .level p{margin:0;color:var(--paper-dim);font-size:14.5px}

  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;transition:.16s}
  .day .dn{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em;color:var(--paper-dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .day .dn .num{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
  .day .pillar{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-hot);margin-bottom:3px}
  .day .theme{font-size:11.5px;font-style:italic;color:var(--muted);margin-bottom:8px;line-height:1.3}
  .day .focus{font-weight:600;color:#fff;font-size:14px;line-height:1.3;margin-bottom:6px}
  .day p{margin:0;font-size:13.5px;color:var(--paper-dim)}
  .day.today{border-color:var(--red);background:linear-gradient(180deg,rgba(200,16,46,.14),var(--panel))}
  .day.today .dn{color:#fff}
  .day.today:before{content:"TODAY";position:absolute;top:-9px;left:14px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;background:var(--red);color:#fff;padding:2px 8px;border-radius:5px}

  .linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .linkrow a{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 13px;transition:.16s}
  .linkrow a:hover{border-color:var(--red);color:#fff}

  .clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .clip{position:relative;aspect-ratio:9/11;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid var(--line);background:var(--panel) center/cover no-repeat;transition:.16s}
  .clip:hover{border-color:var(--muted)}
  .clip:focus-visible{outline:2px solid var(--red-hot);outline-offset:2px}
  .clip:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
  .clip.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.28);cursor:default}
  .clip.active:before{display:none}
  .clip .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(200,16,46,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.16s;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .clip .lbl{position:absolute;left:11px;bottom:9px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;z-index:1}
  .clip video{width:100%;height:100%;object-fit:cover;display:block;background:#000}

  .timeline{border-left:2px solid var(--line);margin-left:8px}
  .tl{position:relative;padding:0 0 4px 26px;margin-bottom:2px}
  .tl:before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--line)}
  .tl.past:before{background:var(--muted);border-color:var(--muted)}
  .tl.now:before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.2)}
  .tl.next:before{background:var(--gold);border-color:var(--gold)}
  .tlrow{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 16px;margin:6px 0;cursor:pointer;transition:.16s}
  .tlrow:hover{border-color:var(--muted)}
  .tl.now .tlrow{border-color:var(--red)}
  .tlrow .d{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);min-width:118px}
  .tlrow .nm{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em;flex:1}
  .tlrow .st{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tl.now .st{color:#fff;background:var(--red);border-color:var(--red)}
  .tl.next .st{color:var(--gold);border-color:var(--gold)}
  .foundations{margin-top:22px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .fchip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;color:var(--paper-dim);transition:.16s}
  .fchip:hover{border-color:var(--red);color:#fff}

  .builder-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .saved{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:7px}
  .saved .s{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.2s}
  .saved.on .s{background:var(--ok)}
  details.bcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.bcard[open]{border-color:var(--muted)}
  .bsum{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .bsum::-webkit-details-marker{display:none}
  .bsum .caret{color:var(--muted);transition:.2s;font-family:'Space Mono',monospace}
  details[open] .bsum .caret{transform:rotate(90deg)}
  .bsum .bn{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bsum .bd{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap}
  .bsum .tools{display:flex;gap:4px}
  .icb{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px;line-height:1;transition:.14s}
  .icb:hover{color:var(--paper);border-color:var(--muted)}
  .icb.del:hover{color:#fff;background:var(--red);border-color:var(--red)}
  .bbody{padding:4px 16px 18px;border-top:1px solid var(--line)}
  .frow{display:grid;grid-template-columns:1fr 180px;gap:12px;margin:14px 0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .field input,.field textarea{background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;resize:vertical;width:100%}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--red)}
  .field textarea{min-height:64px;line-height:1.45}
  .field .hint{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .dayblock{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
  .dayblock .field+.field{margin-top:10px}
  .pillarTag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
  .pillarTag em{color:var(--paper-dim);font-style:italic;text-transform:none}
  .subh{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px;display:flex;align-items:center;gap:10px}
  .subh:after{content:"";flex:1;height:1px;background:var(--line)}

  .datatools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  dialog{background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px;width:92vw;box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(5,6,10,.7)}
  dialog h3{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;margin:0 0 4px}
  dialog p{color:var(--muted);font-size:13px;margin:0 0 12px}
  dialog textarea{width:100%;min-height:220px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--paper);font-family:'Space Mono',monospace;font-size:12px;padding:12px}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--red);color:#fff;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.05em;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .board{flex-direction:column}
    .board .cell + .cell{border-left:0;border-top:1px solid var(--line)}
    .levels{grid-template-columns:1fr}
    .days{grid-template-columns:1fr 1fr}
    .frow{grid-template-columns:1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .tlrow{flex-wrap:wrap} .tlrow .d{min-width:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lockup">
      <img src="assets/brand/logo.png" alt="Urban Muaythai">
      <div class="u">URBAN<b>MUAYTHAI</b></div>
      <span class="tag">Theme&nbsp;of&nbsp;the&nbsp;Week</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="week" aria-selected="true">This Week</button>
      <button role="tab" data-tab="schedule" aria-selected="false">Schedule</button>
      <button role="tab" data-tab="builder" aria-selected="false">Builder</button>
    </div>
  </div>
  <div id="panel-week"></div>
  <div id="panel-schedule" hidden></div>
  <div id="panel-builder" hidden></div>
</div>

<div class="toast" id="toast"></div>

<dialog id="jsonDlg">
  <h3 id="dlgTitle">Export data</h3>
  <p id="dlgSub"></p>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="dlg-actions">
    <button class="btn ghost" id="dlgClose">Close</button>
    <button class="btn" id="dlgCopy">Copy</button>
    <button class="btn solid" id="dlgLoad" hidden>Load data</button>
  </div>
</dialog>

<script src="drive-enrichments.js"></script>
<script>
(function(){
"use strict";

/* ============ SEED DATA ============ */
const SEED = [
  {id:"boxing", name:"Boxing", slack:"2026-09-04",
   breakdown:`Building boxing combos for muaythai specific. Longer punches, punching straight out, hands returning back to the chin.`,
   main:`Pushing through the feet, twisting in the body, extending in the shoulder and arm. Back heel up off the ground.`,
   kids:`Basic punch combinations no more than 3. Punching with knuckles not fingers. Punching straight, not throwing bombs for power. Hands coming back to the chin.`,
   all:`Back heel up, hands back to the chin. Basic punch combinations (Jab cross hook – Jab cross to the body hook to the head). Mixing basic levels. Pad holders standing in their stance, watching the punches to catch and hold effectively. Small catpaw to catch the punches.`,
   adv:`4+ punch combinations, mixing up the levels body and head. Add slips and returning from blocking punches. Sinking into the punches. Same combos, different tempos. Boxing only sparring.`,
   mon:`Correcting the technique of basic punches. Basic punch combinations, going left to right.`,
   tue:`Introducing body punches, mixing up the levels. Stick to 3 punch combos.`,
   wed:`Longer punch combos 4+, mixing up the levels.`,
   thu:`Start to double up punches on the same side — left jab, left hook, etc. Longer boxing combos.`},

  {id:"leg-kicks", name:"Leg Kicks", slack:"2026-09-11",
   breakdown:`Stepping out 45. Targeting the middle of the thigh. Rolling the hip, turning the hip and sinking the shin into the leg.`,
   main:`Set up with punches, rolling the hip, step out 45, swing same arm down.`,
   kids:`Basic step out, rolling the hip, hitting with the shin, holding the pads correctly.`,
   all:`Same as teens and kids. Set up with basic punch combos.`,
   adv:`Add inside kicks, skipping out around opponent to kick the leg, dutch style kicks. Timing — waiting for the leg to come back down after a check or as they come forward.`,
   mon:`Correcting technique of the rear leg kick. Two styles: big heavy thai style, and quicker sharper dutch style kicks.`,
   tue:`Correcting technique of switch kick to the back leg and step-through left kick to the back leg.`,
   wed:`Teaching inside leg kicks, kicking above the knee. Working orthodox vs southpaw.`,
   thu:`Incorporating all leg kicks together, with basic punch combos to set them up.`},

  {id:"r-body-kick", name:"R Body Kick", slack:null,
   breakdown:`Stepping out 45, targeting the body / cuff of the glove, pivoting on the support foot, turning the hip, hitting with the shin.`,
   main:`Stepping out 45 onto the ball of the foot straight away, one step into the kick, swinging the right arm down. How to set up.`,
   kids:`Holding pads correctly, stepping out onto the ball of the foot. Rolling the hip, hitting with the shin.`,
   all:`Correct stance, using punches to ensure correct distance and set-ups. Focus on technique of the kick.`,
   adv:`Add fakes and feints to land the kick. One step into the kick. Use boxing to set up the kick. Kick sparring.`,
   mon:`Focus on the technique of the kick — slow it right down. Stepping out 45, on the balls of the feet, pivoting on the support leg, rolling the hip, one step into the kick. Kick both targets (body & head).`,
   tue:`Setting up the rear kick with punch combos.`,
   wed:`Setting up the rear kick off teeps / push kicks.`,
   thu:`Stepping off after punching to throw the rear kick. Different combinations finishing with the rear kick. Kick leg then kick body.`},

  {id:"defence", name:"Defence", slack:"2026-09-25",
   overview:`This week develops a dependable defensive system built around slips, pulls, catches and checks. Students first learn each response in isolation with correct positioning and balance, then connect one defence to a counter, layer multiple responses together and finish by applying the full toolbox in freestyle pad work.`,
   breakdown:`Build clean slips, pulls, catches and checks against punches and kicks. Progress from isolated fundamentals to a single defensive response with a counter, then layered defence and freestyle application.`,
   main:`Defend in balance, keep the eyes on the partner and finish ready to return. Every defensive movement should improve position rather than simply avoid the strike.`,
   keyPoints:`Keep the stance underneath the body and remain balanced through every defence.
Use small, economical movements — move only as far as needed to make the strike miss or meet the guard.
Keep the eyes on the partner and the hands ready while slipping or pulling.
Slip outside the line of straight punches without bending at the waist or crossing the feet.
Pull from the hips with the chin protected, then recover immediately into range and stance.
Catch punches with a compact guard; do not reach away from the face or slap at the strike.
Check kicks with the knee and shin while keeping the standing leg stable and the guard high.
Return from defence without pausing so the counter lands while the attacker is still committed.`,
   kids:`Learn one defensive tool at a time against predictable feeds. Prioritise balance, eye contact and one simple return counter.`,
   all:`Build all four tools cleanly, then use one defence per combination on Tuesday before progressing to layered responses on Wednesday.`,
   adv:`Vary the order, target and timing of the feeds. Layer two or more defensive movements, choose from multiple counter options and finish in freestyle pad work.`,
   mfocus:`Fundamentals — defensive tools`,
   mon:`Develop slips, pulls, catches and checks individually against punches and kicks. Isolate each skill, correct the position and make every boxer finish balanced and ready.`,
   tfocus:`One defence into counters`,
   tue:`Use only one defensive movement in each combination. Mix that single slip, pull, catch or check into different combinations, then return with different counter options without adding a second defence.`,
   wfocus:`Layered defensive responses`,
   wed:`Combine multiple defensive movements within one combination. After completing the defensive sequence, counter with different return options while maintaining balance and position.`,
   thfocus:`Freestyle application`,
   thu:`Use freestyle pad holding so students must recognise and incorporate the week's slips, pulls, catches and checks. Encourage appropriate counters while keeping the work controlled and technically clean.`,
   coachingNotes:`Feed clearly and at a controlled pace while each tool is being learned.
Correct stance and balance before increasing speed or adding counters.
Tuesday is strictly one defensive movement per combination, even when the counter changes.
On Wednesday, require at least two defensive responses before the return counter.
Pad holders must present realistic punches and kicks rather than moving the pads without intent.
Keep slips and pulls compact; stop students leaning, turning away or losing sight of the partner.
Keep catches close to the guard and checks tall with the hands protecting the head.
Thursday should test recognition and choice, not become uncontrolled speed work.`,
   goal:`Perform slips, pulls, catches and checks with correct positioning and balance.
Use one defensive movement inside a combination and return immediately with an appropriate counter.
Layer multiple defensive responses before selecting a counter.
Recognise punches and kicks during freestyle pad work and choose the right defensive tool.
Finish every defensive exchange in stance, balanced and ready to continue.`},

  {id:"footwork-angles", name:"Footwork & Angles", slack:"2026-10-02",
   overview:`This week develops footwork and angles as active attacking and defensive tools. Boxers learn to move laterally, pivot and cut new angles without losing stance, balance or readiness. The progression moves from clean movement mechanics to attacking while moving, escaping pressure and countering from a stronger position.`,
   breakdown:`Build balanced lateral movement and pivots, add punches and kicks while moving, then use angles to escape pressure and attack from a new position.`,
   main:`Move with purpose, keep the stance underneath the body and finish every pivot or angle ready to strike again.`,
   keyPoints:`Maintain stance width and balance while moving; do not let the feet cross or come together.
Move the foot closest to the direction first, then let the other foot recover the stance.
Keep the head level and the guard organised instead of bouncing or leaning through the movement.
Pivot on the ball of the foot and turn the hips and shoulders together.
Create the angle with a controlled step or pivot rather than taking an oversized movement.
Attack while moving only when the base remains underneath the body.
Use combinations to move the opponent or occupy their guard, then cut the angle.
When escaping pressure, move off the centreline and counter from the new position instead of retreating straight back.`,
   kids:`Build simple left, right and pivot movements while keeping stance and balance. Add one or two controlled strikes only after the movement is clean.`,
   all:`Connect lateral movement and pivots to basic punch and kick combinations. Finish combinations at a new angle and reset in stance.`,
   adv:`Attack during the movement, cut angles around pressure, vary the pivot direction and counter immediately after escaping into the new position.`,
   mfocus:`Angles and pivots`,
   mon:`Introduce lateral movement, pivots and creating angles while maintaining stance and balance. Isolate each movement first, then finish every repetition facing the target and ready to attack.`,
   tfocus:`Attack while moving`,
   tue:`Add punches and kicks to forward, backward and lateral movement. Use combinations to move the opponent, then step or pivot into a new attacking angle without pausing.`,
   wfocus:`Escape and re-angle`,
   wed:`Use pivots and angles defensively to escape pressure and leave the centreline. Once the new position is established, counter immediately before the opponent can turn and reset.`,
   thfocus:`Freestyle application`,
   thu:`Use freestyle pad work so boxers and pad holders apply the week's lateral movement, pivots, attacking angles and defensive escapes. Keep the movement purposeful and technically controlled.`,
   coachingNotes:`Prioritise stance and balance before speed.
Call out crossed feet, feet coming together and oversized steps immediately.
Make boxers finish every movement facing the target with the guard organised.
Pad holders should move with intent and give the boxer a clear reason to angle.
On Tuesday, reduce combination length if striking causes the footwork to break down.
On Wednesday, pressure forward realistically but under control so the boxer must escape off-line.
Counters should come from the new angle without an unnecessary reset.
Thursday is recognition and application, not random movement for its own sake.`,
   goal:`Move laterally and pivot without crossing the feet or losing stance.
Attack with punches and kicks while maintaining balance.
Use combinations to create a new attacking angle.
Escape pressure by moving off the centreline rather than retreating straight back.
Counter confidently from the new position during freestyle pad work.`},

  {id:"teeps", name:"Teep & Push Kick", slack:"2026-09-18",
   breakdown:`Teep and push kick, built through the week's four-day rhythm: learn it correctly, build combinations, make it work against someone, then put it all together.`,
   main:`Offensive / defensive. Push kick / teep. Attacking key target areas — thigh, stomach, face.`,
   kids:`Correct stance. Support leg flat. Knee up first. Ball of the foot stab. Target just the body.`,
   all:`Same as kids and teens. Use at the end of a combo to disengage.`,
   adv:`Target all areas — leg, body, head. Teep when opponent is kicking to off-balance. Teep / push kick feints and fakes to set up other strikes.`,
   mon:`Correct technique of the teep — knee up first, extend and stab with the ball of the foot. Use defensively at the end of combos. Practice timing as partner steps forward. Teep different targets.`,
   tue:`Correct technique of the push kick — knee up first, whole foot. Use aggressively at start or end of combos. Close distance and follow up with strikes.`,
   wed:`Both teep and push kick off the back of punches and kicks. Jab, teep. Right kick, teep.`,
   thu:`Timing of the teep as boxers step in to punch or as they kick. Sparring / drills.`},

  {id:"fight-iq-traps", name:"Fight IQ — Setting Traps", slack:"2026-10-16",
   overview:`This week develops Fight IQ through pattern recognition, creating reactions and setting traps. Boxers learn to establish a believable attack, notice the opponent's repeated defence and use that information to open a new target. They then practise recognising traps being set against them and adapting instead of responding predictably.`,
   breakdown:`Read repeated patterns, deliberately create reactions with attacks or feints, exploit the opening and adapt when an opponent is trying to set a trap.`,
   main:`Observe the reaction, understand why it happened and use it. A trap should create a predictable response that opens the next attack.`,
   keyPoints:`Establish the real attack first so the opponent has a reason to expect and defend it.
Watch what the opponent does repeatedly after each punch, kick or combination.
Repeat with consistent shape and intent so the pattern feels believable.
Use a feint, rhythm change or target change to draw the expected defence and attack the opening.
Know which reaction the trap is designed to create before starting the combination.
Stay balanced and ready to strike; an oversized fake can reveal the trap or leave the boxer exposed.
Do not continue giving the same defensive response once the opponent has clearly read it.
When reading an opponent's trap, change the defence, angle, timing or counter rather than freezing or becoming random.`,
   kids:`Use a simple pattern: show the same clear attack, observe the repeated defence, then fake it and attack one obvious opening.`,
   all:`Build believable repeated attacks and feints on pads and with partners. Identify the reaction being created, then finish with a controlled counter or new target.`,
   adv:`Layer patterns across rounds, disguise traps with rhythm changes, recognise counter-traps and adapt the defence or counter before the opponent completes their set-up.`,
   mfocus:`Learning to read patterns`,
   mon:`Have the boxer repeatedly throw the same committed attack while the partner uses the same defence. Once the pattern is clear—for example, every kick is checked—the boxer fakes the established attack and goes around or through the repetitive defence.`,
   tfocus:`Create reactions and set traps`,
   tue:`Use repeated attacks or believable feints to deliberately create a defensive reaction. Once the boxer can predict the response, attack the opening it creates with the appropriate follow-up.`,
   wfocus:`Read, adapt and counter`,
   wed:`Identify what the opponent is repeatedly trying to set up. Change the response rather than remaining predictable, then counter from the adjusted defence, angle or timing.`,
   thfocus:`Put it together`,
   thu:`Use freestyle pads or controlled partner drills to combine pattern recognition, repeated attacks, feints, traps, adaptations and counters. Boxers should be able to explain the reaction they are trying to create.`,
   coachingNotes:`Start with clear, repeatable patterns before adding choices or speed.
Partners and pad holders must give believable, consistent reactions so the boxer has something real to read.
Ask the boxer which reaction they are trying to create and which opening it produces.
Do not allow random feints; every fake should connect to an attack already established.
Reward observation and timing rather than power or overly long combinations.
On Wednesday, rotate both roles so each boxer practises setting a trap and recognising one.
If the drill becomes confusing, reduce it to one repeated attack, one predictable defence and one adjustment.
Thursday should remain purposeful freestyle, not random pad calling.`,
   goal:`Recognise a repeated defensive or attacking pattern.
Establish a believable attack before using its fake or variation.
Deliberately create a reaction and exploit the opening.
Identify when an opponent is setting a trap and change the response.
Apply patterns, feints, adaptations and counters during freestyle pads or controlled drills.`},

  {id:"boxing-body-punches", name:"Boxing — Body Punches", slack:"2026-10-23",
   overview:`This week develops accurate body punching and connects head-to-body and punch-to-punch combinations. Boxers learn to change level without losing posture, deliver straight punches and body rips safely, defend body attacks with a compact guard and apply both attack and defence during freestyle pad work.`,
   breakdown:`Build correct body-punch mechanics, add a body shot to set combinations, defend body punches with the guard and bring both sides together on freestyle pads.`,
   main:`Change level with the legs, keep the eyes up and the free hand protecting the head. Land to a safe body target, recover the stance and be ready for the return.`,
   keyPoints:`Lower the level by bending the knees rather than folding at the waist.
Keep the chin tucked, eyes forward and stance underneath the body.
Drive straight punches to the body through the shoulder and hip, then return the hand to guard.
Turn the body into rips and hooks while the opposite hand protects the head.
Use head punches to raise the guard before changing level, or use a body attack to open the head.
Choose controlled targets around the body pad; never strike the spine, kidneys or below the belt.
Defend with elbows connected to the body and a compact guard rather than reaching down.
After blocking, regain position and return immediately with a balanced counter.`,
   kids:`Learn straight punches to the body and one simple body rip on pads. Focus on bending the knees, looking at the target and bringing both hands back to the guard.`,
   all:`Combine head and body punches in short, controlled sequences. Practise a compact body guard and return with one clear counter.`,
   adv:`Use feints, level changes and longer combinations to open the body. Mix attack and defence on freestyle pads, countering immediately after protecting the body.`,
   mfocus:`Body-punch fundamentals`,
   mon:`Introduce correct body-punch technique, including body rips and straight punches to the body. Build the level change from the legs, maintain posture and finish every punch back in stance and guard.`,
   tfocus:`Body punches in combinations`,
   tue:`Use set combinations in which every sequence contains one of the new body punches. Mix head and body targets while keeping the level change balanced and technically clean.`,
   wfocus:`Defending body punches`,
   wed:`Introduce defence against body punches using a compact guard. Connect the elbows to the body, protect the target without looking away and recover into a simple counter.`,
   thfocus:`Freestyle attack and defence`,
   thu:`Bring the week together on freestyle pads. Boxers mix body shots into their combinations while pad holders return controlled body punches so the boxer must recognise, defend and continue.`,
   coachingNotes:`Use body pads or clearly agreed safe targets for all partner work.
Correct boxers who lean forward, drop both hands or look down during the level change.
Keep early combinations short so body position remains strong.
Pad holders should present body targets at a realistic height and angle.
On Wednesday, make the defensive feed clear and controlled before adding counters.
On Thursday, returned body punches must be technical prompts—not hard surprise shots.
Require boxers to finish every exchange balanced, guarded and able to move.`,
   goal:`Throw straight body punches and body rips with correct level change and posture.
Connect head and body punches in controlled combinations.
Protect the body with a compact guard while maintaining vision and balance.
Counter cleanly after defending a body punch.
Apply body-punch attack and defence during freestyle pad work.`},

  {id:"kicking-variation", name:"Kicking — Target & Style Variation", slack:"2026-10-30",
   overview:`This week develops low, body and high-kick variation using consistent core mechanics. Boxers compare committed Thai-style kicks with quicker Dutch-style kicks, disguise the target through boxing, feints and level changes, then apply suitable defence and counters in same-stance and opposite-stance matchups.`,
   breakdown:`Develop low, body and high kicks, compare Thai-style and Dutch-style delivery, disguise the target and understand kicking choices across stance matchups.`,
   main:`Keep the base balanced, turn the hip through the target and recover in stance. Change the target or tempo without sacrificing clean mechanics.`,
   keyPoints:`Set the range before kicking and step or pivot from a stable stance.
Turn the hip and support foot so the shin travels cleanly through the target.
Keep the posture organised and recover the kicking leg under control.
Use the same initial shape to make low, body and high kicks harder to read.
Thai-style kicks can carry more committed hip rotation; Dutch-style kicks are generally quicker and connect tightly to boxing combinations.
Use punches, feints and level changes to move the guard and disguise the selected target.
In same stance, recognise the open and closed-side targets available; in opposite stance, account for the changed line and lead-side weapons.
Choose an appropriate check, block, catch, evade or counter for the kick and stance relationship.`,
   kids:`Develop safe low and body-kick targets with clean balance and pad holding. Introduce target changes without requiring head contact.`,
   all:`Practise low, body and controlled high-kick mechanics, then use simple boxing or feints to disguise the selected target.`,
   adv:`Switch between Thai and Dutch rhythms, vary targets inside longer combinations and adapt the defence and counter for same-stance and opposite-stance partners.`,
   mfocus:`Low, body and high-kick fundamentals`,
   mon:`Develop the same sound kicking mechanics across low, body and high targets. Introduce the difference between a more committed Thai-style kick and a quicker Dutch-style kick linked to boxing.`,
   tfocus:`Setups and kick variation`,
   tue:`Use boxing, feints and level changes to disguise the kick, then switch between low, body and high targets. Build the variations into controlled pad combinations.`,
   wfocus:`Stance matchups, defence and counters`,
   wed:`Introduce kicking choices in same-stance and opposite-stance matchups. Practise the appropriate defence for the line of the kick, then return with a balanced counter.`,
   thfocus:`Freestyle kicking application`,
   thu:`Bring the week together on freestyle pads. Boxers vary target, style, setup and stance-aware response while pad holders give realistic prompts for defence and counters.`,
   coachingNotes:`Do not chase target height at the expense of posture, balance or control.
Keep head kicks on pads and technically controlled for the appropriate class level.
Make the distinction between Thai and Dutch style visible through rhythm and combination structure, not exaggerated labels.
Require every feint to create a reason for the target change.
On Wednesday, identify the stance matchup before starting the drill.
Pad holders must present safe, consistent targets and realistic defensive feeds.
Reduce speed or combination length whenever kicking mechanics deteriorate.`,
   goal:`Kick low, body and high targets with consistent core mechanics.
Demonstrate the practical rhythm difference between Thai-style and Dutch-style kicking.
Use boxing, feints and level changes to disguise a kick.
Recognise same-stance and opposite-stance kicking lines.
Defend and counter kicks appropriately during structured and freestyle work.`},

  {id:"teeps-balance-distance", name:"Teeps — Balance & Distance", slack:"2026-11-06",
   overview:`This week develops lead and rear teeps as tools for balance, range control and disruption. Boxers build the base mechanics first, place teeps and push kicks at the end of combinations, then learn to parry and counter before applying the complete skill set on freestyle pads.`,
   breakdown:`Develop lead and rear teeps, maintain balance and distance, finish combinations with a teep or push kick, and use a parry-and-counter response.`,
   main:`Lift the knee before extending, stay tall on the support leg and recover the foot into stance. Use the weapon to manage distance—not simply to push as hard as possible.`,
   keyPoints:`Start from a balanced stance with the support foot stable and the guard organised.
Lift the knee on a direct line before extending the leg.
Use the ball of the foot for a stabbing teep and the broader sole for a driving push kick when appropriate.
Keep the hips underneath the shoulders instead of leaning excessively backwards.
Use the lead side for speed and range control; use the rear side when more reach or drive is required.
Retract the leg on the same line and return directly to stance.
At the end of a combination, use the teep to reset distance and prevent an easy return.
Parry across the line with a small movement, keep the opposite hand protecting the head and counter while the opponent is recovering.`,
   kids:`Learn a balanced lead and rear teep to the body pad. Focus on knee first, controlled extension and returning the foot to stance.`,
   all:`Use lead and rear teeps after basic combinations, then build a simple parry and one controlled counter.`,
   adv:`Vary timing and target, use the teep to intercept forward movement and select different counters after the parry without losing position.`,
   mfocus:`Build the base`,
   mon:`Develop the correct stance and technique for lead and rear teeps and push kicks. Emphasise the knee lift, upright balance, clean extension and controlled recovery into stance.`,
   tfocus:`Finish combinations with the teep`,
   tue:`Build basic Muaythai combinations that finish with a teep or push kick. Use the final strike to manage range, disrupt balance and leave the boxer in a safe position.`,
   wfocus:`Parry and counter`,
   wed:`Introduce basic defence against the teep and push kick using a compact parry. Move the kick off-line without overreaching, then counter while the opponent is recovering their stance.`,
   thfocus:`Freestyle distance management`,
   thu:`Bring the week together on freestyle pads. Boxers choose lead or rear teeps, finish combinations at the correct range and respond to controlled teep feeds with a parry and counter.`,
   coachingNotes:`Keep all teeps on appropriate pads or clearly agreed safe partner targets.
Correct boxers who swing the leg without lifting the knee first.
Do not allow excessive leaning, hopping or falling backwards after contact.
Pad holders should resist just enough to provide structure without forcing the boxer off balance.
On Tuesday, the teep must finish the combination and create useful distance.
On Wednesday, keep the parry compact; large swats expose the guard and delay the counter.
Use controlled feeds on Thursday so recognition and positioning remain the priority.`,
   goal:`Perform balanced lead and rear teeps with correct knee lift and recovery.
Use a teep or push kick to finish a combination and manage distance.
Select the lead or rear side appropriately for range and purpose.
Parry a teep without overreaching or losing guard.
Counter promptly and safely after moving the kick off-line.`},

  {id:"elbows", name:"Elbows", slack:null,
   breakdown:`Hitting with the sharp part of the elbow. Close-range weapon, designed to cut. Works when the opponent steps in or the boxer moves forward.`,
   main:`Hand position on the chest for a strong elbow. Hands relaxed. Twisting in the body. Stepping in with the front foot, sliding the rear foot to follow. Keeping stance.`,
   kids:`Correct technique. Use jab, cross or hook to set up the elbow. Don't step out of stance coming forward.`,
   all:`Same as kids / teens, mix up levels of punches to set up elbows. Basic combos.`,
   adv:`Mix levels of strikes to set up elbows. Step off after an elbow into kick, knee, punch. Timing as opponent comes forward. Elbows from the clinch.`,
   mon:`Punch combos to basic elbows. Get opponent to guard up, then elbow through the gaps.`,
   tue:`Hand control / long guard into elbows.`,
   wed:`Spike elbows, 12-6 elbows, elbow set-ups from the teep.`,
   thu:`All elbows together — long elbow combos. Jab, cross, R over elbow, long guard, R up elbow, L elbow.`},

  {id:"clinch", name:"Clinch", slack:"2026-10-09",
   overview:`This week develops confident clinch entries, turns, off-balancing and knees. Boxers learn several safe ways to close distance, establish strong position and disrupt their partner's base before striking. The week then adds set combinations, defensive posture and hand positioning before finishing with freestyle pad application.`,
   breakdown:`Develop clinch entries, turns, off-balancing and knees, then learn how to maintain posture and base when an opponent initiates the clinch.`,
   main:`Enter safely, establish posture and inside position, move the partner's base and only then add the knee.`,
   keyPoints:`Enter behind a controlled strike, guard or hand-fighting action rather than reaching from too far away.
Keep the clinch stance square and balanced with the feet underneath the hips.
Maintain tall posture, a protected chin and strong head position.
Fight for useful inside hand and forearm position without muscling or yanking.
Control the back of the head rather than pulling on the neck or shoulder.
Turn with the feet and hips together so the whole body creates the angle.
Off-balance by disrupting the partner's stance before attempting the knee.
When defending an entry, recover posture, widen the base when needed and rebuild hand position before attacking.`,
   kids:`Use simple, controlled entries and basic turns with balanced partners. Practise knee mechanics on bags or pads and avoid forceful pulling or dumps.`,
   all:`Develop several entries, stable clinch posture, basic turns and off-balancing. Add a controlled knee only after the partner's base has been disrupted.`,
   adv:`Chain entries from combinations, change hand position during the clinch, turn in either direction and counter an opponent's entry before returning with knees.`,
   mfocus:`Clinch entries and off-balancing`,
   mon:`Work technically through different ways to enter the clinch. Once position is established, use stance, footwork and controlled turns to off-balance the partner while remaining balanced.`,
   tfocus:`Entry, off-balance and knee`,
   tue:`Use set combinations to enter the clinch, establish control, off-balance the partner and finish with a controlled knee strike. Keep the sequence connected rather than pausing between stages.`,
   wfocus:`Posture, stance and hand position`,
   wed:`When the opponent enters the clinch, maintain strong posture, a stable stance and effective hand or forearm position to reduce being turned or thrown off balance. Recover position before countering.`,
   thfocus:`Freestyle application`,
   thu:`Use freestyle pad work so pad holders and boxers incorporate clinch entries naturally into combinations. Add turns, off-balancing and controlled knees when the position is available.`,
   coachingNotes:`Keep partner work controlled and match boxers appropriately.
No hard pulling, neck cranking or muscling through poor position.
Correct posture and stance before teaching more complex turns.
Require clear control and off-balance before the knee is thrown.
Pad holders should give realistic entry opportunities rather than standing square and waiting.
On Wednesday, reward posture recovery and hand position before counter-attacking.
Keep knees controlled in partner work and use pads or bags when more power is required.
Thursday should blend clinch entries into normal pad combinations instead of becoming static clinch wrestling.`,
   goal:`Enter the clinch safely from more than one set-up.
Maintain a square, balanced stance and strong posture.
Turn and off-balance a partner without muscling.
Connect a combination to clinch control, off-balance and a controlled knee.
Defend an opponent's entry by recovering posture, base and hand position.
Use clinch entries naturally during freestyle pad work.`},

  {id:"knees-to-head", name:"Knees to the Head", slack:"2026-06-19",
   breakdown:`Set up with boxing to get the guard up. Pull the head down. Controlling the head, breaking posture.`,
   main:`K1-style straight knees. Pull the head down. Jumping / flying knees — timing, unpredictability. Not to be spammed.`,
   kids:`Bags / one thai pad to bring knees up high, around or straight up. Target the chin. Jumping games — how high can they get.`,
   all:`Same as kids and teens, into forearm pads. Basic hand control to pull the head down.`,
   adv:`Clinch to pull opponent down to knee the head. Jumping knee timing and set-ups. Low stabbing teep to fold the body and knee the head. Inside leg kicks / sweeps, knee as they fall.`,
   mon:`Breaking posture to pull the head lower for the knee. Basic hand control / clinch.`,
   tue:`Punch-to-knee-the-head / K1 style. Cover up, grab the guard, knee straight up while pulling the head down.`,
   wed:`Jumping knees / flying knees.`,
   thu:`Using all together. Freestyle pads.`},

  {id:"building-combos", name:"Building Combos", slack:"2026-06-26",
   breakdown:`Building combos with various strikes. Using patterns to create openings. (Jab, jab – cross body, jab – cross body – leg kick.)`,
   main:`Pads held correctly, pad holders watching the strikes. Boxers returning to their stance after each strike / combo.`,
   kids:`Basic building combos — punches to kicks.`,
   all:`Same as kids / teens, mixing up levels and some defence.`,
   adv:`Combos to set up big strikes using patterns and changing rhythm. (Jab low kick, jab low kick, jab high kick.) Step off, change angles for new openings. Feints and fakes.`,
   mon:`Basic building of combos — punch to kick. Build timing and set-ups. Jab – jab, cross – jab, cross, switch kick.`,
   tue:`Using punches to build up for elbow and knee strikes.`,
   wed:`Build combos, mixing up levels. Head, body, head.`,
   thu:`Build combos using basic clinch.`},

  {id:"spinning", name:"Spinning Techniques", slack:"2026-07-03",
   breakdown:`Spinning heel kicks, elbows, back fist. Lots of stretching before and after class to aid all the twisting.`,
   main:`Stepping out next to the partner's lead / rear foot, looking over the shoulder before throwing. Back leg stays put. Return the same way you spun — don't spin through.`,
   kids:`Basic spinning back kick on the kick shield. Feet in the right position, not spinning all the way through.`,
   all:`Same as kids and teens. Spinning elbows on the back of punches, knee up for the spinning heel kick. Basic set-ups.`,
   adv:`Spinning elbows from the clinch, spinning kicks / punches off missed shots and set-ups.`,
   mon:`Spinning backfist and backfist set-ups.`,
   tue:`Spinning elbows and set-ups — from range and from the clinch.`,
   wed:`Spinning heel kicks and set-ups.`,
   thu:`Using all together. Freestyle pads.`},

  {id:"defending-punches", name:"Defending Punches", slack:"2026-07-10",
   breakdown:`Get people used to blocking punches — catch first if nervous, then block with the guard and long guard (head and body). Then evolve to parries / slips.`,
   main:`Guard tight on the head, not loose. Gloves pressed into the head, small gap for vision. Not one guard fits all — move the guard to defend different shots.`,
   kids:`Basic blocks to the body. Elbows tucked in tight, bracing for the punches.`,
   all:`Block basic jab, cross, hook. Guard tight, pressing into the forehead, not out in front of the face. Comfortable blocking, staying in stance, bracing for impact.`,
   adv:`Work the long guard. Introduce parries and slips.`,
   mon:`Work the basic guard. Block straight punches, hooks, uppercuts.`,
   tue:`Parrying straight punches, long guard to block overhands and hooks.`,
   wed:`Slipping straight punches, rolling under hooks. Move away from punches.`,
   thu:`Use all defences, mixed together. Partner drills.`},

  {id:"blocking-kicks", name:"Blocking Kicks", slack:"2026-07-17",
   breakdown:`Block kick — head, body, leg.`,
   main:`Checks. Knee to elbow, elbow on the outside of the knee. Build a shield — no gap between elbow and knee.`,
   kids:`Blocking kicks to legs and body.`,
   all:`Blocking and footwork to defend the attacker.`,
   adv:`Evading kicks and returning after defending.`,
   mon:`Revise the basic leg / body check. Check strong.`,
   tue:`Dutch guard as a last resort (not a block in Muay Thai but takes away some damage). Return with punches — favours a heavy hitter.`,
   wed:`Block a head kick — two hands over one side.`,
   thu:`Use all together. Partner drills / pad work — pad holder kicking back at different heights.`},

  {id:"catching-kicks", name:"Catching Kicks", slack:"2026-07-24",
   breakdown:`Two types of catching: underhook catch, and step-and-scoop catch. Step with the kick, lock the leg tight, shrug the shoulder lifting the leg. Lean back slightly (the counter to being kicked). Step the rear foot back to create space to throw the leg.`,
   main:`Step with the kick. Shrug the shoulder. Step back to create space to throw the leg.`,
   kids:`Basic step-and-scoop catch. Catch with one arm, hold tight. Throw the leg off to the side.`,
   all:`Same as kids / teens, add the underhook catch. Shrug the shoulder, step the rear foot back to throw the leg and return with a kick.`,
   adv:`Same as all levels, strike straight off the catch before throwing the leg.`,
   mon:`Basic overhook catch — throw and kick back.`,
   tue:`Underhook catch — step back and throw away, kick back.`,
   wed:`Defend once the leg is caught. Turn the hip over, pull partner in, grab the head, drive weight down. Punch as soon as the leg is caught.`,
   thu:`Both catches, striking once you've caught the kick. Catch kick – punch, catch kick – pull elbow.`},

  {id:"defensive-movement", name:"Defensive Movement", slack:"2026-07-31",
   breakdown:`All forms of defensive movement — stepping off, blocking kicks and punches, slips, parries and returning. Moving defensively after attacking.`,
   main:`Don't switch off after attacking. Partners actively engaged, kicking / punching the boxer back.`,
   kids:`Basic kick then check on the bag / partner drills.`,
   all:`Pad holders strike the boxers back, forcing them to block, working reactions. Easy in controlled drills, harder when unexpected.`,
   adv:`Attack, defend, and be the last to strike — winning the exchange.`,
   mon:`Stepping back after striking / angling off after striking.`,
   tue:`Moving left and right / angling as partner comes forward, with punches.`,

SEED.forEach(t=>{ const u=window.DRIVE_ENRICHMENTS && window.DRIVE_ENRICHMENTS[t.id]; if(u) Object.assign(t,u); });

/* fixed four-day teaching rhythm — same every week, technique content sits underneath */
const DAY_PILLARS=[
  {label:"Learn the Skill", theme:"Learn it correctly."},
  {label:"Build Combinations", theme:"Build flow."},
  {label:"Defence & Application", theme:"Make it work against someone."},
  {label:"Put It Together", theme:"Put everything together."}
];

/* fields added after the first version — backfilled from SEED on load so existing saves gain them */
const NEW_FIELDS=["overview","keyPoints","coachingNotes","goal","mfocus","tfocus","wfocus","thfocus","videos"];

/* ============ persistence ============ */
const KEY="totw:data:v11";
const hasStore = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
let data = SEED.map(normalize);

async function load(){
  if(!hasStore) return;
  try{
    const r=await window.storage.get(KEY);
    if(r && r.value){
      const parsed=JSON.parse(r.value);
      if(Array.isArray(parsed) && parsed.length){
        const merged=parsed.map(normalize);
        const seedById={}; SEED.forEach(s=>seedById[s.id]=s);
        merged.forEach(t=>{ const s=seedById[t.id]; if(!s) return;
          NEW_FIELDS.forEach(f=>{ if(!t[f] && s[f]) t[f]=s[f]; }); });
        data=merged;
      }
    }
  }catch(e){}
}
let saveTimer=null;
function save(){
  if(!hasStore) return;
  clearTimeout(saveTimer); setSaved(false);
  saveTimer=setTimeout(async()=>{ try{ await window.storage.set(KEY, JSON.stringify(data)); setSaved(true); }catch(e){} },400);
}
function setSaved(on){ const el=document.querySelector('.saved'); if(el) el.classList.toggle('on',on); }

/* ============ helpers ============ */
function normalize(t){
  const f={id:"",name:"",slack:null,overview:"",breakdown:"",main:"",keyPoints:"",kids:"",all:"",adv:"",
    mfocus:"",mon:"",tfocus:"",tue:"",wfocus:"",wed:"",thfocus:"",thu:"",coachingNotes:"",goal:"",doc:"",img:"",videos:""};
  return Object.assign(f,t);
}
function uid(){ return "t"+Math.random().toString(36).slice(2,8); }
const MS=86400000;
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function midnight(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(d){ return d.getDate()+" "+MON[d.getMonth()]; }
function fmtDY(d){ return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); }
function teachStart(t){ const s=parseISO(t.slack); return s? addDays(s,3):null; }
function datedSorted(){ return data.filter(t=>t.slack).sort((a,b)=>teachStart(a)-teachStart(b)); }
function foundations(){ return data.filter(t=>!t.slack); }
function currentIndex(today){ const list=datedSorted(); let idx=-1; for(let i=0;i<list.length;i++){ if(teachStart(list[i])<=today) idx=i; } return idx===-1?0:idx; }
const TODAY = midnight(new Date());

/* ============ state ============ */
let tab="week";
let viewIdx=currentIndex(TODAY);

/* ============ THIS WEEK ============ */
function renderWeek(){
  const list=datedSorted();
  const el=document.getElementById('panel-week');
  if(!list.length){ el.innerHTML=`<div class="hero"><div class="eye">No scheduled weeks yet</div><h1>Add a technique</h1><p class="sub">In the Builder, set a Slack date on a technique to schedule it into the term.</p></div>`; return; }

  viewIdx=Math.max(0,Math.min(viewIdx,list.length-1));
  const t=list[viewIdx];
  const nowIdx=currentIndex(TODAY);
  const isNow=viewIdx===nowIdx;
  const start=teachStart(t), end=addDays(start,5);
  const next=list[viewIdx+1]||null;
  const liveT=list[nowIdx];
  const nextNow=list[nowIdx+1]||null;

  const days=[["Monday",t.mon,t.mfocus,1,DAY_PILLARS[0]],["Tuesday",t.tue,t.tfocus,2,DAY_PILLARS[1]],["Wednesday",t.wed,t.wfocus,3,DAY_PILLARS[2]],["Thursday",t.thu,t.thfocus,4,DAY_PILLARS[3]]];
  const todayDOW = isNow ? TODAY.getDay() : -1;
  const anyDay = t.mon||t.tue||t.wed||t.thu;
  const anyLevel = t.kids||t.all||t.adv;
  const overviewTxt = t.overview || t.breakdown;

  let html=`
    <div class="board">
      <div class="cell"><div class="k"><span class="dot"></span>Teaching now</div><div class="v">${esc(liveT.name)}</div></div>
      <div class="cell next"><div class="k">Up next</div><div class="v">${nextNow?esc(nextNow.name):"—"}</div></div>
    </div>

    <div class="weeknav">
      <div class="lbl">Week of ${fmtD(start)} – ${fmtDY(end)}${isNow?"  ·  live":""}</div>
      <div class="grp">
        <button class="btn" id="wPrev" ${viewIdx===0?"disabled":""} aria-label="Previous week">◀ Prev</button>
        <button class="btn ${isNow?"":"solid"}" id="wNow">${isNow?"This week":"Jump to now"}</button>
        <button class="btn" id="wNext" ${viewIdx===list.length-1?"disabled":""} aria-label="Next week">Next ▶</button>
      </div>
    </div>

    <div class="hero">
      <div class="eye">Theme of the Week</div>
      <h1>${esc(t.name)}</h1>
      <p class="sub">${esc(t.breakdown||"")}</p>
      <div class="chips">
        ${isNow?`<span class="chip live"><span class="dot"></span>Teaching this week</span>`:`<span class="chip">Week ${viewIdx+1} of ${list.length}</span>`}
        ${next?`<span class="chip">Up next · ${esc(next.name)}</span>`:``}
      </div>
    </div>`;

  if(overviewTxt){ html+=`<div class="section-h">Overview</div><div class="card"><p class="dim">${fmtRich(overviewTxt)}</p></div>`; }

  if(t.keyPoints){ html+=`<div class="section-h">Key technical points</div><div class="card safety">${renderPoints(t.keyPoints)}</div>`; }
  else if(t.main){ html+=`<div class="section-h">Main points</div><div class="card"><p class="dim">${fmtRich(t.main)}</p></div>`; }

  if(anyLevel){ html+=`
    <div class="section-h">Level progression</div>
    <div class="levels">
      <div class="level kids"><h3><span class="pip"></span>Kids / Teens</h3><p>${fmtRich(t.kids||"—")}</p></div>
      <div class="level all"><h3><span class="pip"></span>All Levels</h3><p>${fmtRich(t.all||"—")}</p></div>
      <div class="level adv"><h3><span class="pip"></span>Advanced</h3><p>${fmtRich(t.adv||"—")}</p></div>
    </div>`; }

  if(anyDay){ html+=`
    <div class="section-h">Weekly class plan</div>
    <div class="days">
      ${days.map(([nm,txt,foc,dow,pillar])=>`
        <div class="day ${dow===todayDOW?"today":""}">
          <div class="dn">${nm}<span class="num">${String(dow).padStart(2,"0")}</span></div>
          <div class="pillar">${esc(pillar.label)}</div>
          <div class="theme">Theme: ${esc(pillar.theme)}</div>
          ${foc?`<div class="focus">${esc(foc)}</div>`:``}
          <p>${fmtRich(txt||"—")}</p>
        </div>`).join("")}
    </div>`; }

  if(t.coachingNotes){ html+=`<div class="section-h">Coaching notes</div><div class="card safety">${renderPoints(t.coachingNotes)}</div>`; }
  if(t.goal){ html+=`<div class="section-h">Goal by end of week</div><div class="card">${renderPoints(t.goal)}</div>`; }

  const vids=String(t.videos||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const coverFor=src=>src.replace(/\.(mp4|mov|webm|m4v)$/i,"-cover.jpg");
  if(vids.length){ html+=`
    <div class="section-h">Session clips</div>
    <div class="clips">
      ${vids.map((v,i)=>`<div class="clip" data-vi="${i}" role="button" tabindex="0" style="background-image:url('${escAttr(coverFor(v))}')"><span class="play">▶</span><span class="lbl">Clip ${i+1}</span></div>`).join("")}
    </div>`; }

  if(t.doc||t.img){ html+=`<div class="linkrow">
      ${t.doc?`<a href="${escAttr(t.doc)}" target="_blank" rel="noopener">Technique document ↗</a>`:``}
      ${t.img?`<a href="${escAttr(t.img)}" target="_blank" rel="noopener">Slack image ↗</a>`:``}
    </div>`; }

  el.innerHTML=html;
  const p=el.querySelector('#wPrev'), n=el.querySelector('#wNext'), now=el.querySelector('#wNow');
  if(p) p.onclick=()=>{ viewIdx--; renderWeek(); };
  if(n) n.onclick=()=>{ viewIdx++; renderWeek(); };
  if(now) now.onclick=()=>{ viewIdx=currentIndex(TODAY); renderWeek(); };

  if(vids.length){
    const revertClip=card=>{
      if(!card.classList.contains('active')) return;
      const i=parseInt(card.dataset.vi,10);
      card.classList.remove('active');
      card.style.backgroundImage=`url('${escAttr(coverFor(vids[i]))}')`;
      card.innerHTML=`<span class="play">▶</span><span class="lbl">Clip ${i+1}</span>`;
    };
    const openClip=(card)=>{
      if(card.classList.contains('active')) return;
      el.querySelectorAll('.clip').forEach(revertClip);
      const i=parseInt(card.dataset.vi,10), src=vids[i];
      card.classList.add('active');
      card.style.backgroundImage='';
      card.innerHTML=`<video src="${escAttr(src)}" poster="${escAttr(coverFor(src))}" controls autoplay playsinline></video>`;
    };
    el.querySelectorAll('.clip').forEach(c=>{
      c.onclick=()=>openClip(c);
      c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openClip(c); } };
    });
  }
}

/* ============ SCHEDULE ============ */
function renderSchedule(){
  const list=datedSorted(); const nowIdx=currentIndex(TODAY);
  const el=document.getElementById('panel-schedule');
  el.innerHTML=`
    <div class="section-h">Term schedule</div>
    <div class="timeline">
      ${list.map((t,i)=>{
        let cls="",st="";
        if(i<nowIdx){ cls="past"; st="Done"; }
        else if(i===nowIdx){ cls="now"; st="This week"; }
        else if(i===nowIdx+1){ cls="next"; st="Up next"; }
        else { st="Upcoming"; }
        return `<div class="tl ${cls}"><div class="tlrow" data-i="${i}" role="button" tabindex="0">
          <span class="d">Wk of ${fmtD(teachStart(t))}</span>
          <span class="nm">${esc(t.name)}</span>
          <span class="st">${st}</span></div></div>`;
      }).join("")}

    <div class="foundations">

  el.querySelectorAll('.tlrow').forEach(r=>{ const go=()=>{ viewIdx=parseInt(r.dataset.i,10); switchTab('week'); };

  el.querySelectorAll('.fchip').forEach(c=>{ const go=()=>openBuilderAt(c.dataset.id);

/* ============ BUILDER ============ */
let openId=null;
function renderBuilder(){
  const el=document.getElementById('panel-builder');
  el.innerHTML=`
    <div class="builder-top">
      <div class="saved ${hasStore?'on':''}"><span class="s"></span>${hasStore?'Saved automatically':'Session only — export to keep a copy'}</div>
      <div class="grp" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn solid" id="bAdd">+ Add technique</button></div>
    </div>
    <div id="bList"></div>
    <div class="datatools">
      <button class="btn" id="bExport">Export data</button>
      <button class="btn" id="bImport">Import data</button>
      <button class="btn ghost" id="bReset">Reset to original</button>
    </div>`;
  const listEl=el.querySelector('#bList');
  listEl.innerHTML = data.map(cardHTML).join("");

  data.forEach((t,i)=>{
    const card=listEl.querySelector(`details[data-id="${t.id}"]`); if(!card) return;
    if(t.id===openId) card.open=true;
    card.querySelectorAll('[data-f]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const f=inp.dataset.f;
        t[f]= f==="slack" ? (inp.value||null) : inp.value;
        if(f==="name"){ const bn=card.querySelector('.bn'); if(bn) bn.textContent=inp.value||"Untitled"; }
        if(f==="slack"){ const bd=card.querySelector('.bd'); if(bd) bd.textContent=slackTag(t); }
        save();
      });
    });
    card.querySelector('.up').onclick =()=>move(i,-1);
    card.querySelector('.down').onclick=()=>move(i, 1);
    card.querySelector('.del').onclick =()=>{ if(confirm(`Delete "${t.name||'this technique'}"? This can't be undone.`)){ data.splice(i,1); save(); renderBuilder(); refreshViews(); } };
    card.addEventListener('toggle',()=>{ if(card.open) openId=t.id; });
  });

  el.querySelector('#bAdd').onclick=()=>{ const t=normalize({id:uid(),name:"New technique"}); data.push(t); openId=t.id; save(); renderBuilder(); refreshViews();
    const c=document.querySelector(`details[data-id="${t.id}"]`); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); };
  el.querySelector('#bExport').onclick=openExport;
  el.querySelector('#bImport').onclick=openImport;
  el.querySelector('#bReset').onclick=()=>{ if(confirm("Reset everything back to the original curriculum? Your edits will be lost.")){ data=SEED.map(normalize); openId=null; save(); renderBuilder(); refreshViews(); toast("Reset to original"); } };
}

      <div class="field"><label>Coaching notes <span class="hint">— one per line, **bold** for emphasis</span></label><textarea data-f="coachingNotes">${esc(t.coachingNotes)}</textarea></div>
      <div class="field"><label>Goal by end of week <span class="hint">— one per line</span></label><textarea data-f="goal">${esc(t.goal)}</textarea></div>
      <div class="field"><label>Session clips <span class="hint">— one video URL per line</span></label><textarea data-f="videos">${esc(t.videos)}</textarea></div>
      <div class="subh">Links</div>
      <div class="grid2">
        <div class="field"><label>Document link</label><input type="text" data-f="doc" value="${escAttr(t.doc)}" placeholder="https://"></div>
        <div class="field"><label>Slack image link</label><input type="text" data-f="img" value="${escAttr(t.img)}" placeholder="https://"></div>
      </div>
    </div>
  </details>`;
}
function move(i,dir){ const j=i+dir; if(j<0||j>=data.length) return; const [it]=data.splice(i,1); data.splice(j,0,it); openId=it.id; save(); renderBuilder(); refreshViews(); }
function openBuilderAt(id){ openId=id; switchTab('builder'); const c=document.querySelector(`details[data-id="${id}"]`); if(c){ c.open=true; c.scrollIntoView({behavior:'smooth',block:'center'}); } }

/* ============ export / import ============ */
const dlg=document.getElementById('jsonDlg');
function openExport(){
  document.getElementById('dlgTitle').textContent="Export data";
  document.getElementById('dlgSub').textContent="Your full curriculum as JSON. Copy it somewhere safe as a backup.";
  const ta=document.getElementById('dlgText'); ta.value=JSON.stringify(data,null,2); ta.readOnly=true;
  document.getElementById('dlgLoad').hidden=true; document.getElementById('dlgCopy').hidden=false; dlg.showModal();
}
function openImport(){
  document.getElementById('dlgTitle').textContent="Import data";
  document.getElementById('dlgSub').textContent="Paste exported JSON to replace everything. This overwrites your current data.";
  const ta=document.getElementById('dlgText'); ta.value=""; ta.readOnly=false; ta.placeholder="Paste JSON here…";
  document.getElementById('dlgLoad').hidden=false; document.getElementById('dlgCopy').hidden=true; dlg.showModal();
}
document.getElementById('dlgClose').onclick=()=>dlg.close();
document.getElementById('dlgCopy').onclick=async()=>{ const ta=document.getElementById('dlgText');
  try{ await navigator.clipboard.writeText(ta.value); toast("Copied to clipboard"); }catch(e){ ta.select(); try{document.execCommand('copy');}catch(_){} toast("Copied"); } };
document.getElementById('dlgLoad').onclick=()=>{
  try{ const parsed=JSON.parse(document.getElementById('dlgText').value); if(!Array.isArray(parsed)||!parsed.length) throw 0;
    data=parsed.map(normalize); openId=null; save(); dlg.close(); viewIdx=currentIndex(TODAY); renderBuilder(); refreshViews(); toast("Data loaded");
  }catch(e){ toast("That doesn't look like valid data"); } };

/* ============ tabs ============ */
function switchTab(name){
  tab=name;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===name)));
  document.getElementById('panel-week').hidden = name!=="week";
  document.getElementById('panel-schedule').hidden = name!=="schedule";
  document.getElementById('panel-builder').hidden = name!=="builder";
  if(name==="week") renderWeek(); if(name==="schedule") renderSchedule(); if(name==="builder") renderBuilder();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function refreshViews(){ if(tab==="week") renderWeek(); if(tab==="schedule") renderSchedule(); }

/* ============ util ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtRich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
function renderPoints(str){ const items=String(str||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean); if(!items.length) return "";
  return `<ul class="points">${items.map(x=>`<li>${fmtRich(x)}</li>`).join("")}</ul>`; }
let toastT=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }

/* ============ boot ============ */
load().then(()=>{ viewIdx=currentIndex(TODAY); renderWeek(); });
})();
</script>
</body>
</html>
